<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Is This a Normal Dip? using Chart.js</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: white; }
        main { box-sizing: border-box; width: 100%; padding: 6px 10px 8px; background: aliceblue; border: 1px solid silver; }
        h1 { font-size: 22px; margin: 2px 0 4px; text-align: center; }
        .prompt { text-align: center; color: dimgray; margin: 0 0 6px; font-size: 15px; }
        .rule { background: white; border: 2px solid slategray; border-radius: 8px; padding: 6px 10px; font-size: 14px; line-height: 1.3; }
        .rule .note { color: dimgray; font-style: italic; font-size: 12px; }
        .picker { display: none; margin: 8px 0 0; font-size: 15px; }
        .picker select { font-size: 15px; margin-left: 6px; }
        .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .panel { background: white; border: 1px solid silver; border-radius: 8px; padding: 6px 8px; min-width: 0; }
        .panel h2 { font-size: 16px; margin: 0 0 2px; }
        .chart-box { position: relative; height: 190px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: 14px; }
        .row select { font-size: 14px; max-width: 62%; }
        .panel button, .footer button { font-size: 15px; padding: 6px 12px; border-radius: 6px; border: 2px solid navy;
                         background: navy; color: white; cursor: pointer; }
        .panel button { width: 100%; margin-top: 6px; }
        .panel button:disabled { background: lightsteelblue; border-color: lightsteelblue; cursor: default; }
        .status { min-height: 38px; margin-top: 4px; font-size: 13px; line-height: 1.3; }
        .status.good { color: darkgreen; }
        .status.bad { color: firebrick; }
        .feedback { margin-top: 8px; background: white; border: 1px solid silver; border-radius: 8px; padding: 6px 10px;
                    min-height: 76px; font-size: 14px; line-height: 1.35; }
        .feedback.good { background: honeydew; border: 2px solid seagreen; }
        .feedback.bad { background: mistyrose; border: 2px solid firebrick; }
        .footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 15px; }
        @media (max-width: 639px) {
            .panels { grid-template-columns: 1fr; }
            .panel.hidden { display: none; }
            .picker { display: block; }
            h1 { font-size: 19px; }
            .prompt { margin-bottom: 4px; font-size: 14px; }
            .rule { font-size: 13px; padding: 4px 8px; }
            .chart-box { height: 140px; }
            .status { min-height: 0; }
            .feedback { min-height: 0; font-size: 13px; }
            .row { margin-top: 4px; }
        }
    </style>
</head>
<body>
    <main></main>
    <script src="is-this-a-normal-dip.js"></script>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>

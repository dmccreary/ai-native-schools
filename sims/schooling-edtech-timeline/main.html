<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Schooling and EdTech Timeline using vis-timeline</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background: white; }
        #app { height: 640px; display: flex; flex-direction: column; border: 1px solid silver; background: aliceblue; padding: 0 10px 10px; }
        h1 { margin: 0; padding: 8px 0 2px; font-size: 22px; text-align: center; }
        #prompt { font-size: 15px; margin: 0 0 6px; line-height: 1.3; }
        #toolbar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 6px; font-size: 14px; }
        #toolbar button { font-size: 13px; padding: 4px 7px; }
        #toolbar label { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; }
        .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
        #timelineWrap { flex: none; height: 330px; background: white; border: 1px solid silver; border-radius: 8px; overflow: hidden; }
        #timeline { height: 100%; }
        #lower { flex: 1; display: flex; gap: 10px; margin-top: 8px; min-height: 0; }
        .panel { background: white; border: 1px solid silver; border-radius: 8px; padding: 8px 10px; font-size: 15px; line-height: 1.35; min-height: 0; overflow: auto; }
        #info { flex: 1; }
        #side { width: 230px; flex: none; display: flex; flex-direction: column; gap: 6px; }
        button { font-family: Arial, Helvetica, sans-serif; font-size: 15px; padding: 6px 8px; border: 2px solid dimgray; border-radius: 8px; background: white; cursor: pointer; }
        button:hover:not(:disabled) { background: aliceblue; border-color: navy; }
        button.primary { background: navy; border-color: navy; color: white; font-weight: bold; }
        button:disabled { color: dimgray; background: whitesmoke; border-color: silver; cursor: default; }
        button.right:disabled { color: darkgreen; background: honeydew; border-color: seagreen; font-weight: bold; }
        button.wrong:disabled { color: firebrick; background: mistyrose; border-color: firebrick; }
        button:focus-visible { outline: 3px solid black; outline-offset: 2px; }
        #quiz { flex: 1; display: none; flex-direction: column; gap: 8px; min-height: 0; }
        #eraBtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        #eraBtns button { font-size: 14px; padding: 6px 4px; }
        #event { font-size: 20px; font-weight: bold; }
        .good { color: darkgreen; }
        .bad { color: firebrick; }
        .lead { font-weight: bold; }
        /* timeline item colors by group */
        .vis-item.structure { background: #fff3c4; border-color: #b8901a; }
        .vis-item.policy { background: #e3eefc; border-color: #4a78b5; }
        .vis-item.technology { background: #e8f5e9; border-color: #2e7d32; }
        .vis-item.vis-point.structure .vis-dot, .vis-item.vis-dot.structure { border-color: #b8901a; }
        .vis-item.vis-point.policy, .vis-item.vis-dot.policy { border-color: #4a78b5; }
        .vis-item.vis-point.technology, .vis-item.vis-dot.technology { border-color: #2e7d32; }
        .vis-item.vis-point { background: transparent; }
        .vis-item.vis-selected { background: #ffd8a8 !important; border-color: #e67700 !important; }
        .vis-item.vis-background.era { background: rgba(120, 120, 160, 0.07); }
        .vis-item.vis-background.era.alt { background: rgba(120, 120, 160, 0.16); }
        .vis-item .vis-item-content { font-size: 12px; padding: 2px 3px; }
        .vis-item.vis-background .vis-item-content { font-size: 11px; color: #444; font-weight: bold; }
        .vis-labelset .vis-label .vis-inner { font-size: 13px; font-weight: bold; }
        @media (max-width: 640px) {
            #lower { flex-direction: column; }
            #side { width: auto; flex-direction: row; flex-wrap: wrap; }
            #eraBtns { grid-template-columns: repeat(3, 1fr); }
            #timelineWrap { height: 340px; }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
<main>
<div id="app">
    <h1>Schooling and EdTech Timeline</h1>
    <p id="prompt">How long have schools been promised a technology revolution?</p>
    <div id="toolbar">
        <label><input type="checkbox" id="gStructure" checked><span class="sw" style="background:#fff3c4;border:2px solid #b8901a"></span>Structure</label>
        <label><input type="checkbox" id="gPolicy" checked><span class="sw" style="background:#e3eefc;border:2px solid #4a78b5"></span>Policy</label>
        <label><input type="checkbox" id="gTechnology" checked><span class="sw" style="background:#e8f5e9;border:2px solid #2e7d32"></span>Technology</label>
        <span style="flex:1"></span>
        <button id="zoomIn" aria-label="Zoom in">Zoom in</button>
        <button id="zoomOut" aria-label="Zoom out">Zoom out</button>
        <button id="panLeft" aria-label="Move earlier">◀</button>
        <button id="panRight" aria-label="Move later">▶</button>
        <button id="fit">Fit all</button>
    </div>
    <div id="timelineWrap"><div id="timeline" role="img" aria-label="Timeline of 20 events in the history of schooling and educational technology, 1848 to 2022, in three groups and five eras"></div></div>
    <div id="lower">
        <div class="panel" id="info" aria-live="polite"></div>
        <div id="quiz">
            <div class="panel" style="flex:none"><div id="qStatus" style="font-size:14px;font-weight:bold;color:#333"></div><div id="qAsk">Which era does this event belong to?</div><div id="event"></div></div>
            <div id="eraBtns"></div>
            <div class="panel" id="qFeedback" style="flex:1" aria-live="polite"></div>
        </div>
        <div id="side">
            <button id="startBtn" class="primary">Start the era quiz</button>
            <button id="nextBtn" class="primary" style="display:none">Next event</button>
            <button id="exploreBtn" style="display:none">Explore the timeline</button>
        </div>
    </div>
</div>
</main>
<script src="schooling-edtech-timeline.js"></script>
<br/>
<a href=".">Back to Lesson Plan</a>
</body>
</html>

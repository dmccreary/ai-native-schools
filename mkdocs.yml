# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'AI-Native Schools'
site_description: 'An interactive intelligent textbook about how AI is enabling more pro-social behaviors in schools. The theme is "Mornings with AI, Afternoons with Each Other".'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/ai-native-schools/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/ai-native-schools'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - '1. The Building Blocks of Schools, Students, and Learning': chapters/01-building-blocks-schools-students/index.md
      - '2. Evidence, Motivation, and the Stakeholders of Schooling': chapters/02-evidence-motivation-stakeholders/index.md
      - '3. School Structures, Equity, and the Industrial-Era Legacy': chapters/03-school-structures-equity-industrial-era/index.md
      - '4. Measuring AI Capability: The METR Task-Horizon Studies': chapters/04-measuring-ai-capability-metr/index.md
      - '5. Projecting AI Growth: Doubling Curves, Limits, and Uncertainty': chapters/05-projecting-ai-growth-doubling-curves/index.md
      - '6. The Five-Level Model of Intelligent Textbooks': chapters/06-five-level-model-intelligent-textbooks/index.md
      - '7. Content Economics and Open Educational Resources': chapters/07-content-economics-open-educational/index.md
      - '8. Tracking Mastery: xAPI, Learning Record Stores, and MicroSims': chapters/08-tracking-mastery-xapi-learning-record/index.md
      - '9. Learning Graphs, Interoperability Standards, and Access at Scale': chapters/09-learning-graphs-interoperability/index.md
      - '10. Student Privacy and Data Governance': chapters/10-student-privacy-data-governance/index.md
      - '11. Mastery Learning and the Case for a Compressed Morning': chapters/11-mastery-learning-case-compressed-morning/index.md
      - '12. AI Guardrails: Teaching Thinking Without Over-Reliance': chapters/12-ai-guardrails-teaching-thinking-without/index.md
      - '13. Social Learning and Human Skills': chapters/13-social-learning-human-skills/index.md
      - '14. The Pro-Social Afternoon': chapters/14-pro-social-afternoon/index.md
      - '15. Technology Adoption and the Diffusion of Innovation': chapters/15-technology-adoption-diffusion-innovation/index.md
      - '16. Organizational Change Models': chapters/16-organizational-change-models/index.md
      - '17. Leading Change: Vision, Culture, and Early-Stage Concerns': chapters/17-leading-change-vision-culture/index.md
      - '18. Sustaining Change: Systems Thinking and National Adoption': chapters/18-sustaining-change-systems-thinking/index.md
      - '19. Microstrategies for Leading Change': chapters/19-microstrategies-leading-change/index.md
      - '20. Designing the AI-Native School Day': chapters/20-designing-ai-native-school-day/index.md
      - '21. Implementing the AI-Native Model Responsibly': chapters/21-implementing-ai-native-model-responsibly/index.md
      - '22. AI-First Case Studies I: Promise and Peril': chapters/22-ai-first-case-studies-i-promise-peril/index.md
      - '23. AI-First Case Studies II: Lessons for Practice': chapters/23-ai-first-case-studies-ii-lessons/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept List: learning-graph/concept-list.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Glossary Quality Report: learning-graph/glossary-quality-report.md
      - FAQ Quality Report: learning-graph/faq-quality-report.md
      - FAQ Coverage Gaps: learning-graph/faq-coverage-gaps.md
      - Mascot Test Page: learning-graph/mascot-test.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - Appendices:
      - AI-First Stories: appendices/ai-first-stories.md

  - FAQ: faq.md
  - Glossary: glossary.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/mascot/neutral.png
  # favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Currency-safe KaTeX math: inline is \(...\) only, never single $.
  # Display math uses $$...$$ or \[...\]. Rendered by docs/js/katex.js.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Custom JavaScript — KaTeX config must load before the KaTeX library
extra_javascript:
  - js/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/cover-image-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'AI-Native Schools'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
